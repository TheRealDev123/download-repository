<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Download Repository UI</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:24px}
      input,button{padding:8px;margin:4px}
      .row{display:flex;gap:8px;align-items:center}
      .files{margin-top:16px}
      .file{padding:6px 8px;border:1px solid #ddd;margin:6px 0;display:flex;justify-content:space-between}
      pre{white-space:pre-wrap}
    </style>
  </head>
  <body>
    <h1>Download Repository</h1>
    <form id="downloadForm" onsubmit="return startDownload();">
      <div class="row">
        <input id="repo_url" placeholder="https://github.com/owner/repo or owner/repo or tree/blob URL" size="60" required />
        <input id="path" placeholder="path inside repo (optional)" />
        <input id="ref" placeholder="branch/ref (optional)" />
        <input id="token" placeholder="GITHUB token (optional)" />
        <button type="submit">Start</button>
      </div>
    </form>
    <div id="status"></div>

    <h2>Downloaded files</h2>
    <div class="files" id="files"></div>

    <script>
      async function fetchFiles(){
        const res = await fetch('/api/files');
        if(!res.ok) return;
        const files = await res.json();
        const container = document.getElementById('files');
        container.innerHTML = '';
        if(files.length === 0){
          container.innerHTML = '<em>No files downloaded yet.</em>';
          return;
        }
        files.forEach(f => {
          const div = document.createElement('div');
          div.className = 'file';
          const name = document.createElement('div');
          name.textContent = f;
          const a = document.createElement('a');
          a.href = '/files/' + encodeURIComponent(f);
          a.textContent = 'Download';
          div.appendChild(name);
          div.appendChild(a);
          container.appendChild(div);
        })
      }

      async function startDownload(){
        const repo_url = document.getElementById('repo_url').value.trim();
        const path = document.getElementById('path').value.trim();
        const ref = document.getElementById('ref').value.trim();
        const token = document.getElementById('token').value.trim();
        const status = document.getElementById('status');
        status.textContent = 'Starting download...';
        const body = { repo_url };
        if(path) body.path = path;
        if(ref) body.ref = ref;
        if(token) body.token = token;
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        if(res.status === 202){
          status.textContent = 'Download started. Refreshing file list in a moment...';
          setTimeout(fetchFiles, 1500);
          setTimeout(fetchFiles, 5000);
        } else {
          const txt = await res.text();
          status.innerHTML = '<pre>' + txt + '</pre>';
        }
        return false;
      }

      // Poll file list every 5 seconds to show newly downloaded files
      fetchFiles();
      setInterval(fetchFiles, 5000);
    </script>
  </body>
</html>
